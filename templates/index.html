<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-xl w-full p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                Content Genius
            </h1>
            <p class="text-slate-400 mt-2">Upload your video to extract viral-ready frames.</p>
        </header>

        <form method="POST" action="/upload" enctype="multipart/form-data" id="uploadForm" class="space-y-6">
            <div class="relative group border-2 border-dashed border-slate-700 rounded-xl p-10 text-center hover:border-cyan-500 transition-colors cursor-pointer">
                <input type="file" name="video" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <div class="space-y-2">
                    <svg class="mx-auto h-12 w-12 text-slate-500 group-hover:text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    <p class="text-slate-300 font-medium">Click or drag video file here</p>
                    <p class="text-xs text-slate-500 uppercase">MP4, MOV up to 500MB</p>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-slate-400">Target Platform</label>
                <select name="platform" class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-cyan-500 outline-none">
                    <option value="instagram">Instagram Reels</option>
                    <option value="tiktok">TikTok</option>
                    <option value="youtube">YouTube Shorts</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-[1.02]">
                Generate Viral Assets
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-cyan-500 mx-auto mb-2"></div>
            <p class="text-slate-400">Removing silence & analyzing frames...</p>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = () => {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').classList.remove('hidden');
        };
    </script>
</body>
</html>
